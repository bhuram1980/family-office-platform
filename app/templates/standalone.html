<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %} — {{ BRAND }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head><body class="site">
{% block body %}{% endblock %}
<div id="toast" class="toast"></div>
<script id="flashes" type="application/json">{{ get_flashed_messages(with_categories=true)|tojson }}</script>
</body></html>
