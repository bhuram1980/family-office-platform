name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fo_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fo_test
      FLASK_APP: app:create_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly to an empty database
        run: flask db upgrade
      - name: Migrations match the models
        run: flask db check
      - name: Test suite
        run: pytest -q
      - name: Seed script runs
        run: flask seed
